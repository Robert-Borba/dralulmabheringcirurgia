<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A96E;--gold2:#F0D99A;--dark:#0D0D0D;--dark3:#1A1A1A;--surface:#222;--text:#F0EDE8;--muted:#8A8580;--radius:14px}
html{scroll-behavior:smooth;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{font-family:"DM Sans",sans-serif;background:var(--dark);color:var(--text);min-height:100vh;height:auto;overflow-x:hidden;overflow-y:auto;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
/* BANNER */
.banner{position:fixed;top:0;left:0;width:100%;z-index:999;background:linear-gradient(135deg,#7a1515,#C0392B,#7a1515);padding:11px 16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 20px rgba(192,57,43,.4)}
.bdot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;animation:bdot 1.4s ease-in-out infinite}
@keyframes bdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.5)}}
.banner p{font-size:clamp(11px,3vw,13px);font-weight:500;color:#fff;letter-spacing:.07em;text-transform:uppercase;text-align:center}
.page{padding-top:0;position:relative;overflow:visible;min-height:100vh}
.page::before{
  content:'';position:fixed;top:-200px;left:-150px;
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,110,.08) 0%,transparent 65%);
  animation:orb1 8s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
.page::after{
  content:'';position:fixed;bottom:-100px;right:-100px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,110,.06) 0%,transparent 65%);
  animation:orb2 10s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.2)}}
@keyframes orb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-80px) scale(1.15)}}
/* HERO */
.hero{display:flex;flex-direction:column;align-items:center;padding:48px 24px 24px;text-align:center;position:relative}
.avatar-ring{width:120px;height:120px;border-radius:50%;border:1.5px solid var(--gold);padding:5px;margin-bottom:20px;position:relative}
.avatar-ring::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(201,169,110,.18)}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--surface);overflow:hidden}
.avatar-inner img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hero-eyebrow{font-size:10px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.hero-name{font-family:"Bodoni 72",Didot,"Bodoni Moda",serif;font-size:clamp(28px,7vw,44px);font-weight:700;color:var(--gold);letter-spacing:-.02em;line-height:1.15}
.hero-name span{font-family:inherit;font-weight:700;color:inherit}
.hero-sub{font-size:clamp(11px,3vw,13px);font-weight:300;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px}
.hero-crm{font-family:"Lato","Inter",sans-serif;font-size:11px;font-weight:300;color:var(--gold);letter-spacing:2px;margin-bottom:16px}
.hero-desc{font-family:"Outfit",sans-serif;font-size:clamp(14px,3.8vw,16px);font-weight:300;color:rgba(240,237,232,.58);max-width:320px;line-height:1.7}
.hero-desc strong{color:var(--gold);font-weight:400}
.divider{width:32px;height:1px;background:var(--gold);margin:18px auto 0}
/* CARDS */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(70px)}
.orb-a{width:440px;height:440px;top:5%;left:-120px;background:rgba(201,169,110,.07);animation:orb1 9s ease-in-out infinite}
.orb-b{width:360px;height:360px;top:55%;right:-100px;background:rgba(201,169,110,.05);animation:orb2 12s ease-in-out infinite}
.orb-c{width:320px;height:320px;bottom:10%;left:10%;background:rgba(201,169,110,.04);animation:orb1 7s 2s ease-in-out infinite}
.cards{display:flex;flex-direction:column;gap:16px;padding:20px 14px 40px;max-width:600px;margin:0 auto}
/* BASE CARD */
.card{border-radius:var(--radius);border:1px solid rgba(201,169,110,.15);background:var(--dark3);overflow:hidden;position:relative;transition:border-color .35s,box-shadow .35s,transform .35s;will-change:transform}
.card.visible{opacity:1;transform:translateY(0)}
.card:hover{border-color:rgba(201,169,110,.4);box-shadow:0 16px 48px rgba(0,0,0,.5)}
.card:active{transform:scale(.985)}
/* CARD FULL BG */
.card-full{min-height:280px;background-size:cover;background-position:right center;display:flex;align-items:center}
.card-full .card-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.88) 0%,rgba(10,10,10,.6) 42%,rgba(10,10,10,.05) 70%);z-index:1;pointer-events:none}
.card-full .card-body{padding:32px 28px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:2;max-width:52%;min-height:100%;}
.card-3-anim .card-body{max-width:58%}
/* CARD SPLIT */
.card-split{display:grid;grid-template-columns:1fr 180px;min-height:230px}
.card-split .card-body{padding:24px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;z-index:2}
.card-split .card-image{position:relative;overflow:hidden;min-height:100%}
.card-split .card-image img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transition:transform .6s ease}
.card-split:hover .card-image img{transform:scale(1.06)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;padding:4px 10px;border-radius:30px;align-self:flex-start}
.badge-red{background:rgba(192,57,43,.14);border:1px solid rgba(192,57,43,.32);color:#e74c3c}
.badge-gold{background:rgba(201,169,110,.11);border:1px solid rgba(201,169,110,.28);color:var(--gold)}
.badge-green{background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.24);color:#25D366}
.bdot-red{width:5px;height:5px;border-radius:50%;background:#e74c3c;animation:bdot 1.2s ease-in-out infinite;flex-shrink:0}
.bdot-green{width:5px;height:5px;border-radius:50%;background:#25D366;animation:bdot 1.8s ease-in-out infinite;flex-shrink:0}
/* TÍTULO */
.card-title{font-family:"Outfit",sans-serif;font-size:clamp(14px,3.8vw,20px);font-weight:300;color:var(--text);line-height:1.35;text-transform:uppercase;letter-spacing:.04em}
.card-title em{background:linear-gradient(90deg,#A07840,#E8C97A,#F0D99A,#C9A96E,#A07840);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal;font-weight:400;animation:text-shine 3s linear infinite}
@keyframes text-shine{0%{background-position:0% center}100%{background-position:200% center}}
/* BOTÃO */
.card-btn{
  display:inline-flex;align-items:center;gap:8px;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#8a6020,#C9A96E,#F0D99A,#C9A96E,#8a6020);
  background-size:200% auto;
  border:none;color:#0D0D0D;
  font-family:"Inter","Montserrat",sans-serif;
  font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 22px;border-radius:60px;
  cursor:pointer;text-decoration:none;align-self:flex-start;
  animation:btn-bg-shine 3s linear infinite;
}
.card-btn::before{
  content:"";position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.4),transparent);
  animation:btn-shine 2.2s ease-in-out infinite;
  pointer-events:none;
}
.card-btn span{position:relative;z-index:1}
.card-btn svg{width:11px;height:11px;transition:transform .3s;position:relative;z-index:1;flex-shrink:0}
.card:hover .card-btn svg{transform:translateX(4px)}
@keyframes btn-bg-shine{0%{background-position:0% center}100%{background-position:200% center}}
@keyframes btn-shine{0%{left:-100%}60%{left:200%}100%{left:200%}}
.card-btn-green{background:linear-gradient(135deg,#0d6e2e,#25D366,#7fffc4,#25D366,#0d6e2e);background-size:200% auto;color:#0D0D0D}
/* ANIMAÇÕES BORDA CARDS */
@property --a1{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --a2{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --a3{syntax:"<angle>";initial-value:0deg;inherits:false}
/* card-full borda pulsando */
.card-full-anim{animation:pulse-border 3s ease-in-out infinite}
@keyframes pulse-border{0%,100%{border-color:rgba(201,169,110,.15)}50%{border-color:rgba(201,169,110,.6);box-shadow:0 0 0 1px rgba(201,169,110,.2)}}
/* card 2 borda girando */
.card-2-anim{animation:spin-border-2 3s linear infinite}
@keyframes spin-border-2{
  0%{border-color:rgba(201,169,110,.15)}
  25%{border-color:rgba(201,169,110,.8);box-shadow:2px 0 8px rgba(201,169,110,.3)}
  50%{border-color:rgba(201,169,110,.15)}
  75%{border-color:rgba(201,169,110,.8);box-shadow:-2px 0 8px rgba(201,169,110,.3)}
  100%{border-color:rgba(201,169,110,.15)}
}
/* card 3 borda verde girando */
.card-3-anim{animation:spin-border-3 3.5s linear infinite}
@keyframes spin-border-3{
  0%{border-color:rgba(37,211,102,.15)}
  25%{border-color:rgba(37,211,102,.8);box-shadow:2px 0 8px rgba(37,211,102,.3)}
  50%{border-color:rgba(37,211,102,.15)}
  75%{border-color:rgba(37,211,102,.8);box-shadow:-2px 0 8px rgba(37,211,102,.3)}
  100%{border-color:rgba(37,211,102,.15)}
}
/* partículas card 2 */
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.ptc{position:absolute;bottom:-6px;border-radius:50%;background:var(--gold);opacity:0}
.ptc:nth-child(1){width:3px;height:3px;left:10%;animation:fup 4.2s 0s ease-in-out infinite}
.ptc:nth-child(2){width:2px;height:2px;left:25%;animation:fup 3.8s .7s ease-in-out infinite}
.ptc:nth-child(3){width:4px;height:4px;left:45%;animation:fup 4.5s 1.5s ease-in-out infinite}
.ptc:nth-child(4){width:2px;height:2px;left:65%;animation:fup 3.6s 2.2s ease-in-out infinite}
.ptc:nth-child(5){width:3px;height:3px;left:82%;animation:fup 4s 3s ease-in-out infinite}
.ptc:nth-child(6){width:2px;height:2px;left:38%;animation:fup 4.8s 1.1s ease-in-out infinite}
@keyframes fup{0%{transform:translateY(0);opacity:0}15%{opacity:.8}80%{opacity:.2}100%{transform:translateY(-160px);opacity:0}}
/* glow verde card 3 */
.glow-green{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(37,211,102,.18) 0%,transparent 70%);animation:breathe 2.4s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes breathe{0%,100%{transform:translateY(-50%) scale(1);opacity:.5}50%{transform:translateY(-50%) scale(1.4);opacity:1}}
.footer{text-align:center;padding:20px 16px 44px;color:var(--muted);font-size:11px;letter-spacing:.04em;border-top:1px solid rgba(201,169,110,.07)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .card-split{grid-template-columns:1fr 110px;min-height:unset}
  .card-split .card-body{padding:18px 14px;gap:12px}
  .card-full{min-height:220px}
  .card-full .card-overlay{background:linear-gradient(90deg,rgba(10,10,10,.94) 0%,rgba(10,10,10,.7) 48%,rgba(10,10,10,.0) 72%)}
  .card-full .card-body{padding:20px 16px;max-width:58%}
  .card-title{font-size:13.5px;letter-spacing:.02em;line-height:1.38}
  .card-btn{font-size:9px;padding:9px 14px;letter-spacing:.12em}
  .badge{font-size:8px;padding:3px 8px}
  .cards{padding:16px 10px 32px}
}
/* GARANTIA DE ROLAGEM */
@media(max-width:768px){html,body{overflow-y:auto!important;height:auto!important;position:relative!important;touch-action:pan-y!important;-webkit-overflow-scrolling:touch!important}.page{overflow:visible!important;height:auto!important;min-height:100vh!important}.cards{padding-bottom:90px}}
</style>
